name: Nightly audio recognition

# Full end to end recognition run over every champion and both languages.
# Too slow for pull requests, so it runs once a night and leaves an accuracy
# report behind as an artifact.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      regenerate_fixtures:
        description: 'Ignore the fixture cache and regenerate the audio'
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  FFMPEG_DIR: 'C:\ffmpeg'
  REPORT_PATH: 'tests/reports/recognition_report.json'

permissions:
  contents: read

jobs:
  audio:
    name: Recognition accuracy
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The audio suite and its generator are added by the tests work. Until
      # they land the job reports that there is nothing to run instead of
      # failing the nightly schedule.
      - name: Check for the audio suite
        id: probe
        shell: pwsh
        run: |
          $generator = Test-Path "tests/tools/generate_audio_fixtures.py"
          $suite = (Get-ChildItem -Path "tests" -Filter "*.py" -Recurse -ErrorAction SilentlyContinue |
                    Select-String -Pattern "pytest.mark.audio" -List | Measure-Object).Count -gt 0
          "generator=$($generator.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "suite=$($suite.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "generator present: $generator, audio tests present: $suite"

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-windows-release-essentials-v1

      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-extract" -Force
          $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $env:FFMPEG_DIR | Out-Null
          Copy-Item -Path "$($inner.FullName)\*" -Destination $env:FFMPEG_DIR -Recurse -Force

      - name: Put ffmpeg on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:FFMPEG_DIR\bin"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Fixture key follows the pinned Data Dragon patch and the generator
      # itself, so new champions or a changed generator produce fresh audio.
      - name: Cache audio fixtures
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/audio
          key: audio-fixtures-${{ hashFiles('tests/fixtures/VERSION', 'tests/tools/generate_audio_fixtures.py') }}
          restore-keys: |
            audio-fixtures-

      - name: Generate audio fixtures
        if: >-
          steps.probe.outputs.generator == 'true' &&
          (steps.fixture-cache.outputs.cache-hit != 'true' || inputs.regenerate_fixtures)
        run: python tests/tools/generate_audio_fixtures.py --all

      - name: Run the audio suite
        if: steps.probe.outputs.suite == 'true'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          LOLVOICE_AUDIO_REPORT: ${{ env.REPORT_PATH }}
        run: |
          New-Item -ItemType Directory -Force -Path "tests/reports" | Out-Null
          python -m pytest -m audio -ra --durations=25

      - name: Report missing suite
        if: steps.probe.outputs.suite != 'true'
        run: echo "No tests marked audio were found, nothing to run tonight."

      - name: Upload recognition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-report
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:REPORT_PATH") {
            $report = Get-Content "$env:REPORT_PATH" -Raw | ConvertFrom-Json
            "## Recognition accuracy" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Overall: $($report.accuracy)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "No recognition report was produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
