name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  PYTHON_VERSION: '3.10'

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get current version
        id: current_version
        run: |
          # Read version from version.json or use default
          if [ -f version.json ]; then
            VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Calculate next version
        id: version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          
          # Parse version components
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Determine version bump
          if [[ "${{ github.event.inputs.release_type }}" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "${{ github.event.inputs.release_type }}" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Update version.json
          echo "{\"version\": \"$NEW_VERSION\"}" > version.json
      
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD)
          
          # Format for GitHub release
          FORMATTED_CHANGELOG="## What's Changed\n\n$CHANGELOG\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')...v${{ steps.version.outputs.version }}"
          
          # Save to file for multiline output
          echo "$FORMATTED_CHANGELOG" > changelog.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$FORMATTED_CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Upload version info
        uses: actions/upload-artifact@v3
        with:
          name: version-info
          path: |
            version.json
            changelog.txt

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Download version info
        uses: actions/download-artifact@v6
        with:
          name: version-info
      
      - name: Update version in code
        shell: python
        run: |
          import json
          import re
          
          # Read version
          with open('version.json') as f:
              version_data = json.load(f)
              version = version_data['version']
          
          # Update build_config.py
          with open('build_config.py', 'r') as f:
              content = f.read()
          
          content = re.sub(r'VERSION = "[^"]*"', f'VERSION = "{version}"', content)
          
          with open('build_config.py', 'w') as f:
              f.write(content)
          
          print(f"Updated version to {version}")
      
      - name: Create icon if missing
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFont
          import os
          
          os.makedirs('assets', exist_ok=True)
          
          # Create simple icon if doesn't exist
          if not os.path.exists('assets/icon.ico'):
              img = Image.new('RGB', (256, 256), color='#2b2f36')
              d = ImageDraw.Draw(img)
              
              # Draw a simple logo
              d.ellipse([28, 28, 228, 228], fill='#00ff88')
              d.text((128, 128), "LoL\nVC", fill='#2b2f36', anchor="mm")
              
              img.save('assets/icon.ico', format='ICO', sizes=[(256, 256)])
              print("Created icon.ico")
      
      - name: Build main application
        run: |
          python build.py --app-only
      
      - name: Build installer
        run: |
          python build.py --installer-only
      
      - name: Create portable ZIP
        shell: python
        run: |
          import zipfile
          import json
          from pathlib import Path
          
          with open('version.json') as f:
              version = json.load(f)['version']
          
          dist_dir = Path('dist')
          app_dir = dist_dir / 'app' / 'LoLVoiceController'
          zip_path = dist_dir / f'LoLVoiceController_{version}_portable.zip'
          
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for file_path in app_dir.rglob('*'):
                  if file_path.is_file():
                      arcname = file_path.relative_to(app_dir.parent)
                      zipf.write(file_path, arcname)
          
          print(f"Created portable ZIP: {zip_path}")
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: |
            dist/installer/*.exe
            dist/*.zip

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-pyaudio
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Download version info
        uses: actions/download-artifact@v6
        with:
          name: version-info
      
      - name: Build Linux executable
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          
          pyinstaller \
            --name LoLVoiceController \
            --onefile \
            --add-data "models:models" \
            --add-data "config:config" \
            --add-data "data:data" \
            --hidden-import tkinter \
            --hidden-import sounddevice \
            --hidden-import numpy \
            main.py
          
          # Create AppImage
          mkdir -p dist/AppDir/usr/bin
          cp dist/LoLVoiceController dist/AppDir/usr/bin/
          
          # Create desktop file
          cat > dist/AppDir/LoLVoiceController.desktop <<EOF
          [Desktop Entry]
          Name=LoL Voice Controller
          Exec=LoLVoiceController
          Icon=lol-voice-controller
          Type=Application
          Categories=Game;
          EOF
          
          # Create tarball
          cd dist
          tar czf LoLVoiceController_${VERSION}_linux.tar.gz LoLVoiceController
          cd ..
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: dist/*.tar.gz

  create-release:
    name: Create Release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v6
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: LoL Voice Controller ${{ needs.version.outputs.version }}
          body: ${{ needs.version.outputs.changelog }}
          draft: false
          prerelease: false
      
      - name: Upload Windows Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows-build/installer/LoLVoiceController_Setup.exe
          asset_name: LoLVoiceController_${{ needs.version.outputs.version }}_Setup.exe
          asset_content_type: application/octet-stream
      
      - name: Upload Windows Portable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows-build/LoLVoiceController_${{ needs.version.outputs.version }}_portable.zip
          asset_name: LoLVoiceController_${{ needs.version.outputs.version }}_portable.zip
          asset_content_type: application/zip
      
      - name: Upload Linux Build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linux-build/LoLVoiceController_${{ needs.version.outputs.version }}_linux.tar.gz
          asset_name: LoLVoiceController_${{ needs.version.outputs.version }}_linux.tar.gz
          asset_content_type: application/gzip
      
      - name: Update version in repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json
          git commit -m "🔖 Bump version to ${{ needs.version.outputs.version }}" || true
          git push